  browser-contracts:
    name: Full audit / Browser contracts
    needs:
      - browser-collection
      - browser-checks
      - browser-role-journeys
      - selected-native-return
    if: always() && (github.event_name != 'workflow_dispatch' ||
      (inputs.execution_scope != 'backend-source' && inputs.execution_scope !=
      'source-return'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every original browser scope and role group
        working-directory: ${{ runner.temp }}
        env:
          COLLECTION_RESULT: ${{ needs.browser-collection.result }}
          CHECKS_RESULT: ${{ needs.browser-checks.result }}
          ROLES_RESULT: ${{ needs.browser-role-journeys.result }}
          SELECTED_RESULT: ${{ needs.selected-native-return.result }}
          RECOVERY_SCOPE: ${{ github.event_name == 'workflow_dispatch' &&
            inputs.execution_scope == 'recovery-return' }}
        run: |
          if [ "$RECOVERY_SCOPE" = true ]; then
            test "$SELECTED_RESULT" = success
            test "$COLLECTION_RESULT" = skipped
            test "$CHECKS_RESULT" = skipped
            test "$ROLES_RESULT" = skipped
          else
            test "$COLLECTION_RESULT" = success
            test "$CHECKS_RESULT" = success
            test "$ROLES_RESULT" = success
            test "$SELECTED_RESULT" = skipped
          fi
  dependency-review:
    name: Full audit / Dependency review
    if: github.event_name == 'pull_request' || (github.event_name ==
      'workflow_dispatch' && inputs.execution_scope == 'recovery-return')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
