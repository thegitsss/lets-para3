        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          base-ref: ${{ github.event_name == 'workflow_dispatch' &&
            '501cee87480df00ce5a1afe1d0488a4fed34d5d5' || '' }}
          head-ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
