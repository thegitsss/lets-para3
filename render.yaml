# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: lets-para3
    runtime: node
    repo: https://github.com/thegitsss/lets-para3
    branch: main
    buildCommand: cd backend && node scripts/verify-runtime.js && npm ci
    preDeployCommand: cd backend && npm run migrate:production:apply
    startCommand: cd backend && npm start
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    domains:
      - www.lets-paraconnect.com
    renderSubdomainPolicy: disabled
    previews:
      generation: manual
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.18.0
      - key: APP_BASE_URL
        value: https://www.lets-paraconnect.com
      - key: CLIENT_BASE_URL
        value: https://www.lets-paraconnect.com
      - key: FRONTEND_BASE_URL
        value: https://www.lets-paraconnect.com
      - key: PUBLIC_ORIGIN
        value: https://www.lets-paraconnect.com
      - key: EMAIL_BASE_URL
        value: https://www.lets-paraconnect.com
      - key: CORS_ORIGINS
        value: https://www.lets-paraconnect.com
      - key: WEBAUTHN_ORIGIN
        value: https://www.lets-paraconnect.com
      - key: WEBAUTHN_RP_ID
        value: www.lets-paraconnect.com
      - key: WEBAUTHN_RP_NAME
        value: Let's-ParaConnect
      - key: JWT_ISSUER
        value: https://www.lets-paraconnect.com
      - key: JWT_AUDIENCE
        value: lets-paraconnect-web
      - key: STRIPE_API_VERSION
        value: 2026-07-29.dahlia
      - key: STRIPE_CONNECT_COUNTRY
        value: US
      - key: STRIPE_WEBHOOK_ALERTS_ENABLED
        value: "true"
      - key: PLATFORM_FEE_ATTORNEY_PERCENT
        value: "22"
      - key: PLATFORM_FEE_PARALEGAL_PERCENT
        value: "18"
      - key: STRIPE_CONNECT_RETURN_URL
        value: https://www.lets-paraconnect.com/profile-settings.html?stripe=return
      - key: STRIPE_CONNECT_REFRESH_URL
        value: https://www.lets-paraconnect.com/profile-settings.html?stripe=refresh
      - key: STRIPE_CHECKOUT_SUCCESS_URL
        value: "https://www.lets-paraconnect.com/dashboard-attorney.html?payment=success#funds"
      - key: STRIPE_CHECKOUT_CANCEL_URL
        value: "https://www.lets-paraconnect.com/dashboard-attorney.html?payment=cancel#funds"
      - key: ENABLE_CSRF
        value: "true"
      - key: REQUIRE_AUTH_SESSION
        value: "true"
      - key: REQUIRE_DATA_ENCRYPTION
        value: "true"
      - key: S3_MALWARE_SCAN_REQUIRED
        value: "true"
      - key: ENABLE_TWO_FACTOR
        value: "true"
      - key: TURNSTILE_ENFORCED
        value: "true"
      - key: EMAIL_DISABLE
        value: "false"
      - key: MESSAGE_EMAIL_SUPPRESS_MINUTES
        value: "120"
      - key: INCIDENT_AUTO_DEPLOY_ENABLED
        value: "false"
      - key: INCIDENT_PREVIEW_DEPLOY_MODE
        value: disabled
      - key: INCIDENT_PRODUCTION_DEPLOY_MODE
        value: disabled
      - key: INCIDENT_ROLLBACK_MODE
        value: disabled
      - key: BUSINESS_TIME_ZONE
        value: America/New_York
      - key: TZ
        value: America/New_York
      - key: LEGAL_APPROVED_TERMS_VERSION
        value: "2026-08-15"
      - key: LEGAL_APPROVED_PRIVACY_VERSION
        value: "2026-08-15"
      - key: LEGAL_COUNSEL_APPROVAL_ID
        sync: false
      - key: LEGAL_APPROVED_TERMS_SHA256
        sync: false
      - key: LEGAL_APPROVED_PRIVACY_SHA256
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_SAFETY_SALT
        sync: false
      - key: OPENAI_SUPPORT_MANAGER_ENABLED
        value: "true"
      - key: OPENAI_ATTORNEY_MANAGER_ENABLED
        sync: false
      - key: OPENAI_ATTORNEY_MANAGER_ROLLOUT_PERCENT
        sync: false
      - key: OPENAI_ATTORNEY_MANAGER_ALLOWLIST
        sync: false
      - key: OPENAI_ATTORNEY_LEGACY_FALLBACK
        value: "false"
      - key: OPENAI_PARALEGAL_MANAGER_ENABLED
        value: "false"
      - key: OPENAI_PARALEGAL_MANAGER_ROLLOUT_PERCENT
        value: "0"
      - key: OPENAI_PARALEGAL_LEGACY_FALLBACK
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
