    repo: https://github.com/thegitsss/lets-para3
    branch: main
    schedule: "*/5 * * * *"
    buildCommand: cd backend && node scripts/verify-runtime.js && PUPPETEER_SKIP_DOWNLOAD=true MONGOMS_DISABLE_POSTINSTALL=true npm ci
    startCommand: cd backend && npm run ops:monitor
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.18.0
      - key: APP_BASE_URL
        value: https://www.lets-paraconnect.com
      - key: OPS_HEALTHCHECK_URL
        value: https://www.lets-paraconnect.com/api/health
      - key: EMAIL_DISABLE
        value: "false"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "true"
      - key: MONITOR_CHECK_WEBHOOKS
        value: "true"
      - key: MONITOR_REQUIRE_BACKUP
