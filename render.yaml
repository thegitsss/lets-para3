        value: https://www.lets-paraconnect.com/api/auth/google/callback
      - key: TURNSTILE_SECRET
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: OWNER_ALERT_EMAILS
        sync: false
      - key: FOUNDER_EMAIL
        sync: false
      - key: INCIDENT_FOUNDER_APPROVER_EMAILS
        sync: false
      - key: INCIDENT_FOUNDER_ALERT_EMAILS
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_OAUTH_REDIRECT_URI
        value: https://www.lets-paraconnect.com/api/admin/marketing/publishing/channel-connections/linkedin_company/oauth/callback
      - key: ZOHO_MAIL_REFRESH_TOKEN
        sync: false
      - key: ZOHO_MAIL_CLIENT_ID
        sync: false
      - key: ZOHO_MAIL_CLIENT_SECRET
        sync: false
      - key: DIRECTOR_SMTP_USER
        sync: false
      - key: DIRECTOR_SMTP_PASS
        sync: false

  - type: worker
    name: lets-para3-incident-runner
    runtime: node
    repo: https://github.com/thegitsss/lets-para3
    branch: main
    buildCommand: cd backend && node scripts/verify-runtime.js && PUPPETEER_SKIP_DOWNLOAD=true MONGOMS_DISABLE_POSTINSTALL=true npm ci
    startCommand: cd backend && npm run incident:runner
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.18.0
      - key: APP_BASE_URL
        value: https://www.lets-paraconnect.com
      - key: EMAIL_BASE_URL
        value: https://www.lets-paraconnect.com
      - key: EMAIL_DISABLE
        value: "false"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "true"
      - key: INCIDENT_RUNNER_MAX_JOBS
        value: "1"
      - key: INCIDENT_RUNNER_POLL_MS
        value: "5000"
      - key: INCIDENT_RUNNER_LOCK_MS
        value: "240000"
      - key: INCIDENT_RUNNER_LOCK_RENEW_MS
        value: "30000"
      - key: INCIDENT_RUNNER_HEARTBEAT_MS
        value: "300000"
      - key: INCIDENT_RUNNER_SHUTDOWN_GRACE_MS
        value: "270000"
      - key: INCIDENT_AUTO_DEPLOY_ENABLED
        value: "false"
      - key: INCIDENT_PREVIEW_DEPLOY_MODE
        value: disabled
      - key: INCIDENT_PRODUCTION_DEPLOY_MODE
        value: disabled
      - key: INCIDENT_ROLLBACK_MODE
        value: disabled
      - key: TZ
        value: America/New_York
      - key: MONGO_URI
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_SAFETY_SALT
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: INCIDENT_FOUNDER_APPROVER_EMAILS
        sync: false
      - key: INCIDENT_FOUNDER_ALERT_EMAILS
        sync: false

  - type: cron
