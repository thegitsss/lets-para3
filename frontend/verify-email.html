<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Verify your email – Let’s-ParaConnect</title>
  <link rel="stylesheet" href="assets/styles/fonts.css">
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f7f5; color: #1a2230; font-family: Sarabun, sans-serif; }
    main { width: min(100%, 480px); padding: 32px; border: 1px solid #d8dde5; border-radius: 16px; background: #fff; box-shadow: 0 18px 48px rgba(15, 23, 42, .08); }
    h1 { margin: 0 0 12px; font: 300 2rem/1.15 "Cormorant Garamond", serif; }
    p { line-height: 1.6; }
    a { color: inherit; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid #1a2230; outline-offset: 3px; }
    .skip-link { position: fixed; left: 12px; top: -48px; z-index: 1000; padding: 8px 12px; border-radius: 6px; background: #1a2230; color: #fff; }
    .skip-link:focus { top: 12px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <main id="main" tabindex="-1" aria-labelledby="verificationTitle">
    <h1 id="verificationTitle">Verifying your email</h1>
    <p id="verificationStatus" role="status" aria-live="polite">Please wait while we verify this link.</p>
    <p><a id="verificationAction" href="login.html" hidden>Continue to sign in</a></p>
  </main>
  <script src="assets/scripts/verify-email.js"></script>
  <script type="module" src="assets/scripts/web-vitals-rum.js"></script>
</body>
</html>
