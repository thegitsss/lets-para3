<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="referrer" content="no-referrer" />
  <title>Choose a new password – Let’s-ParaConnect</title>
  <link rel="stylesheet" href="assets/styles/fonts.css" />
  <link rel="stylesheet" href="assets/styles/public-design-system.css?v=20260828-phase8" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="assets/styles/auth-secondary.css?v=20260828-phase8" />
</head>
<body class="auth-secondary password-recovery-page">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="auth-secondary__header"><a class="auth-secondary__brand" href="index.html">Let<span class="auth-secondary__brand-mark">’</span>s-ParaConnect</a></header>
  <main class="recovery-layout" id="main" tabindex="-1">
    <div class="recovery-art overlay" aria-hidden="true"><canvas class="auth-matter-field" data-auth-matter-field></canvas></div>
    <section class="recovery-panel" id="resetPanel" data-state="ready">
      <div class="recovery-panel__inner">
    <p class="recovery-eyebrow" id="resetEyebrow">Account security</p>
    <h1 id="resetTitle">Choose a new password.</h1>
    <p class="lead recovery-lead" id="resetLead">Use a unique passphrase of at least 15 characters. This link expires after 60 minutes and can only be used once.</p>

    <form id="resetForm">
      <div class="field-row">
        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="15" maxlength="128" placeholder="15+ characters" required />
        <button class="toggle-password" type="button" data-target="newPassword" data-public-action="icon">Show password</button>
      </div>

      <div class="field-row">
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="15" maxlength="128" placeholder="Repeat your password" required />
        <button class="toggle-password" type="button" data-target="confirmPassword" data-public-action="icon">Show password</button>
      </div>

      <button type="submit" data-public-action="primary" data-action-shape="control">Reset password</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
    <a class="back-link" href="login.html" data-public-action="text">Back to sign in</a>
      </div>
    </section>
  </main>

  <script src="assets/scripts/reset-password.js"></script>
  <script src="assets/scripts/auth-matter-field.js" defer></script>
  <script type="module" src="assets/scripts/web-vitals-rum.js"></script>
</body>
</html>
