<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Choose a new password – Let’s-ParaConnect</title>
  <link rel="stylesheet" href="assets/styles/fonts.css" />
  <link rel="stylesheet" href="assets/styles/public-design-system.css?v=20260828-phase8" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="shortcut icon" href="/favicon.ico" />

</head>
<body class="auth-secondary password-recovery-page">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="auth-secondary__header"><a class="auth-secondary__brand lpc-brand-lockup" href="index.html" aria-label="Let’s-ParaConnect home"><svg class="home-brand__mountain" viewBox="7 20 50 22" fill="none" stroke="currentColor" stroke-width=".8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.25 39.63C13 39 16.8 34.1 20.1 31.5S23.9 30.4 25.2 30.2C27 29.9 30.4 25.2 32.63 22.38C35 24.3 37.8 29.3 39.2 30.6S42.9 31.5 44.7 33.4S47.7 34.8 49.9 36.7S52.9 38.9 54.8 39.4" /></svg><span class="home-brand__name">Let<span class="auth-secondary__brand-mark">’</span>s-ParaConnect</span></a></header>
  <main class="recovery-layout" id="main" tabindex="-1">
    <div class="recovery-art overlay" aria-hidden="true"><canvas class="auth-matter-field" data-auth-matter-field></canvas></div>
    <section class="recovery-panel" id="resetPanel" data-state="ready">
      <div class="recovery-panel__inner">
    <p class="recovery-eyebrow" id="resetEyebrow">Account security</p>
    <h1 id="resetTitle">Choose a new password.</h1>
    <p class="lead recovery-lead" id="resetLead" hidden></p>

    <form id="resetForm">
      <div class="field-row">
        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="8+ characters" required />
        <button class="toggle-password" type="button" data-target="newPassword" data-public-action="icon">Show password</button>
      </div>

      <div class="field-row">
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
        <button class="toggle-password" type="button" data-target="confirmPassword" data-public-action="icon">Show password</button>
      </div>

      <button type="submit" data-public-action="primary" data-action-shape="control">Reset password</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
    <a class="back-link" href="login.html" data-public-action="text">Back to sign in</a>
      </div>
    </section>
  </main>

  <script src="assets/scripts/reset-password.js"></script>
  <script type="module" src="assets/scripts/web-vitals-rum.js"></script>
</body>
</html>
