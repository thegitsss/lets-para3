<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="assets/styles/fonts.css" />
  <link rel="stylesheet" href="assets/styles/public-design-system.css?v=20260828-phase8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0B2A4A">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password – Let’s-ParaConnect</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="mask-icon" href="maskable-icon.png" color="#0B2A4A" />
  <link rel="stylesheet" href="assets/styles/auth-secondary.css?v=20260828-phase8" />
</head>

<body class="auth-secondary password-recovery-page">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="auth-secondary__header"><a class="auth-secondary__brand" href="index.html">Let<span class="auth-secondary__brand-mark">’</span>s-ParaConnect</a></header>
  <main class="container recovery-layout" id="main" tabindex="-1">
    <div class="recovery-art overlay" aria-hidden="true"><canvas class="auth-matter-field" data-auth-matter-field></canvas></div>
    <section class="recovery-panel">
      <div class="recovery-panel__inner">
        <p class="recovery-eyebrow">Account security</p>
        <h1>Reset your password.</h1>
        <p class="recovery-lead">Enter the email associated with your LPC account. We’ll send a secure reset link if an account exists.</p>
        <form id="resetForm">
          <input type="email" id="email" name="email" required placeholder="you@example.com" aria-label="Email address" />
          <button type="submit" data-public-action="primary" data-action-shape="control">Send reset link</button>
        </form>
        <p id="resetStatus" role="alert" aria-live="polite"></p>
        <a href="login.html" class="cancel-link" data-public-action="text">Back to sign in</a>
      </div>
    </section>
  </main>

  <div id="confirmationModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmationTitle" aria-describedby="confirmationMessage" aria-hidden="true" inert>
    <div class="modal-content">
      <h2 id="confirmationTitle">Check your email</h2>
      <p id="confirmationMessage">If an account exists for that email, a password-reset link is on its way.</p>
      <button type="button" class="close-btn" data-public-action="text">Done</button>
    </div>
  </div>

<script>
  const form = document.getElementById("resetForm");
  const modal = document.getElementById("confirmationModal");
  const closeButton = modal?.querySelector(".close-btn");
  const resetStatus = document.getElementById("resetStatus");
  const submitButton = form?.querySelector('button[type="submit"]');
  let modalReturnFocus = null;

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (resetStatus) resetStatus.textContent = "";
    if (submitButton) {
      submitButton.disabled = true;
      submitButton.textContent = "Sending…";
    }

    const email = document.getElementById("email").value.trim();

    try {
      const csrfResponse = await fetch("/api/csrf", { credentials: "include" });
      const csrfPayload = await csrfResponse.json().catch(() => ({}));
      const csrfToken = csrfPayload?.csrfToken || "";
      const response = await fetch("/api/auth/request-password-reset", {
        method: "POST",
        credentials: "include",
        headers: {
          "Content-Type": "application/json",
          ...(csrfToken ? { "X-CSRF-Token": csrfToken } : {}),
        },
        body: JSON.stringify({ email }),
      });

      if (response.ok) {
        showModal();
        form.reset();
      } else {
        const data = await response.json();
        if (resetStatus) resetStatus.textContent = data.message || "Something went wrong. Please try again.";
      }
    } catch (error) {
      console.error("Error:", error);
      if (resetStatus) resetStatus.textContent = "Server error. Please try again later.";
    } finally {
      if (submitButton) {
        submitButton.disabled = false;
        submitButton.textContent = "Send reset link";
      }
    }
  });

  function showModal() {
    if (!modal) return;
    modalReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
    modal.style.display = "flex";
    modal.setAttribute("aria-hidden", "false");
    modal.removeAttribute("inert");
    closeButton?.focus();
  }

  function closeModal() {
    if (!modal) return;
    modal.style.display = "none";
    modal.setAttribute("aria-hidden", "true");
    modal.setAttribute("inert", "");
    modalReturnFocus?.focus();
  }

  closeButton?.addEventListener("click", closeModal);

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && modal?.style.display === "flex") {
      closeModal();
    }
    if (event.key === "Tab" && modal?.style.display === "flex" && closeButton) {
      event.preventDefault();
      closeButton.focus();
    }
  });
</script>
<script type="module" src="assets/scripts/web-vitals-rum.js"></script>
<script src="assets/scripts/auth-matter-field.js" defer></script>
</body>
</html>
