  <style>
    body.browse-jobs-page {
      font-family: 'Sarabun', sans-serif;
      font-weight: 200;
      color: var(--clean-ink, #1a2230);
      background: var(--clean-surface, #ffffff) !important;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.auth-guarded .jobs-shell {
      visibility: hidden;
    }
    button {
      font-family: 'Sarabun', sans-serif;
      font-weight: 200;
    }

    .sidebar-toggle {
      display: none;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: #202124;
      background: var(--clean-surface, #ffffff);
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: none;
      cursor: pointer;
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1900;
      background: rgba(15, 23, 42, 0.35);
    }

    .jobs-shell {
      width: min(1100px, calc(100% - 48px));
      margin: 24px auto 0;
      padding: 0 24px;
      box-sizing: border-box;
      flex: 1 0 auto;
    }

    .layout {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }

    aside.filter {
      width: 210px;
      flex-shrink: 0;
      background: var(--clean-surface, #fff);
      border: 1px solid rgba(26, 34, 48, 0.08);
      border-radius: 18px;
      padding: 0.9rem;
      position: sticky;
      top: 120px;
    }

    .filter h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 300;
      text-align: center;
      margin-bottom: 0.6rem;
    }

    .filter-group { margin-bottom: 0.85rem; }

    .filter-group label {
      display: block;
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 0.25rem;
    }

    .filter-group select,
    .filter-group input {
      width: 100%;
      padding: 0.45rem 0.6rem;
      border: 1px solid rgba(26, 34, 48, 0.12);
      border-radius: 8px;
      background: var(--clean-surface, #fff);
      font-size: 0.9rem;
      color: var(--clean-muted, #475569);
    }

    .filter-group select:focus,
    .filter-group select:focus-visible,
    .results-controls select:focus,
    .results-controls select:focus-visible {
      outline: none;
      box-shadow: none;
    }

    .slider-field {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .slider-field span { font-size: 0.85rem; color: var(--clean-muted, #475569); }
    input[type="range"] {
      flex: 1;
      accent-color: #0a84ff;
    }

    .filter-actions {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .filter-actions button {
      padding: 0.45rem 0.8rem;
      font-size: 0.9rem;
      border-radius: 999px;
      border: 1px solid #887244;
      background: transparent;
      color: var(--clean-link, #887244);
      cursor: pointer;
      letter-spacing: 0.04em;
    }

    .filter-actions button.primary {
      background: #eef6ff;
      border-color: #c8ddfb;
      color: #3f5f8f;
    }
    .filter-actions #clearFilters {
      border: none;
      background: none;
      min-width: 44px;
      min-height: 44px;
      padding: 0 12px;
      margin-inline-start: -12px;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      color: var(--clean-muted, #5f6b7c);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.16em;
    }

    .filter-actions #clearFilters:hover,
    .filter-actions #clearFilters:focus-visible {
      color: var(--clean-ink, #465264);
      text-decoration-thickness: 2px;
    }

    .results {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .results-header {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(26, 34, 48, 0.05);
      border-radius: 22px;
      padding: 1.5rem;
      box-shadow: 0 24px 70px rgba(10, 15, 25, 0.08);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
    }

    .results-header h1 {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 600;
    }

    .results-header p { color: #64748b; margin: 0.2rem 0 0; }

    .results-controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .results-controls label,
    .results-controls select {
      border: 1px solid rgba(26, 34, 48, 0.12);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      font-size: 0.95rem;
      background: var(--clean-surface, #fff);
      font-family: 'Sarabun', sans-serif;
      font-weight: 200;
    }

    .filter-toggle {
      display: none;
    }

    .jobs-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .job-card {
      border: 1px solid rgba(26, 34, 48, 0.08);
      border-left: 4px solid #887244;
      background: var(--clean-surface, #fff);
      padding: 1.4rem 1.6rem;
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      position: relative;
    }

    .job-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .job-card h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.45rem;
      font-weight: 300;
      margin: 0 0 0.2rem;
    }

    .job-card .area {
      color: var(--clean-muted, #6b7280);
      font-size: 0.95rem;
      margin-bottom: 0.4rem;
    }

    .job-card .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      color: var(--clean-muted, #6b7280);
      font-size: 0.9rem;
      margin-bottom: 0.8rem;
    }

    .partial-completion-note {
      margin-top: 0.35rem;
      margin-bottom: 0.8rem;
      color: var(--clean-muted, #6b7280);
      font-size: 0.85rem;
    }

    .job-card .job-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .job-card-footer {
      margin-top: 0.6rem;
      font-size: 0.82rem;
      color: var(--clean-muted, #6b7280);
    }

    .flag-button {
      border: 1px solid rgba(26, 34, 48, 0.15);
      background: var(--clean-surface, #fff);
      color: #8b6a2f;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
      flex: 0 0 auto;
    }

    .flag-button svg {
      width: 14px;
      height: 14px;
    }

    .flag-button:hover {
      background: rgba(180, 151, 90, 0.12);
      border-color: rgba(180, 151, 90, 0.45);
    }

    .flag-menu {
      position: absolute;
      top: 48px;
      right: 16px;
      width: min(260px, 82vw);
      background: var(--clean-surface, #ffffff);
      border: 1px solid rgba(26, 34, 48, 0.12);
      border-radius: 16px;
      box-shadow: 0 24px 50px rgba(15, 23, 42, 0.16);
      padding: 8px 10px;
      z-index: 4;
    }

    .flag-menu-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 300;
      margin-bottom: 4px;
    }

    .flag-menu-subtitle {
      color: var(--clean-muted, #6b7280);
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    .flag-option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.92rem;
      color: var(--clean-ink, #1a2230);
      margin-bottom: 8px;
    }

    .flag-option input {
      margin-top: 3px;
    }

    .flag-menu-other {
      width: 100%;
      max-width: 100%;
      margin-top: 6px;
    }

    .flag-menu-other textarea {
      display: block;
      width: 100%;
      max-width: 100%;
      min-height: 70px;
      border: 1px solid rgba(26, 34, 48, 0.12);
      border-radius: 12px;
      padding: 8px 10px;
      font-family: 'Sarabun', sans-serif;
      font-size: 0.9rem;
      resize: vertical;
      box-sizing: border-box;
    }

    .flag-menu-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .flag-cancel {
      border: 1px solid #d1d5db;
      background: var(--clean-surface, #ffffff);
      color: var(--clean-muted, #6b7280);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .flag-submit {
      border: 1px solid #887244;
      background: #887244;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .flag-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .clear-button,
    .apply-button {
      border: 1px solid #887244;
      border-radius: 999px;
      padding: 0.45rem 1.3rem;
      font-size: 0.9rem;
      cursor: pointer;
      background: transparent;
      color: var(--clean-link, #887244);
      letter-spacing: 0.02em;
      min-height: 44px;
    }

    .apply-button { background: #887244; color: #fff; }

    .clear-button:hover { background: rgba(180, 151, 90, 0.1); }
    .apply-button:hover { background: #a2864d; border-color: #a2864d; }
    .apply-button.is-disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .apply-button.is-disabled[data-stripe-required="true"] {
      position: relative;
      overflow: hidden;
    }
    .apply-button.is-disabled[data-stripe-required="true"]::after {
      content: attr(data-hover-label);
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 12px;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      color: #fff;
      background: #a2864d;
      border-radius: inherit;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .apply-button.is-disabled[data-stripe-required="true"]:hover::after,
    .apply-button.is-disabled[data-stripe-required="true"]:focus-visible::after {
      opacity: 1;
    }
    .apply-button.is-disabled[data-stripe-required="true"]:hover,
    .apply-button.is-disabled[data-stripe-required="true"]:focus-visible {
      color: transparent;
    }

    .job-card.expanded {
      border-left-width: 6px;
      box-shadow: 0 28px 70px rgba(10, 15, 25, 0.12);
      max-width: 1040px;
      margin: 0 auto;
      animation: jobExpandIn 420ms cubic-bezier(.2,.7,.2,1);
      transform-origin: center top;
      position: relative;
      width: 100%;
      box-sizing: border-box;
    }
    .job-card .pill-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(180, 151, 90, 0.12);
      color: #8b6a2f;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .expanded-card-grid {
      display: grid;
      gap: 1.6rem;
    }
    .expanded-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .expanded-header h3 { margin-bottom: 0.35rem; }
    .expanded-header .meta { margin-bottom: 0; }
    .expanded-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .apply-info-disclosure {
      position: relative;
    }
    .apply-info-disclosure summary {
      list-style: none;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid rgba(26, 34, 48, 0.18);
      color: var(--clean-muted, #6b7280);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      background: var(--clean-surface, #fff);
    }
    .apply-info-disclosure summary::-webkit-details-marker {
      display: none;
    }
    .apply-info-disclosure .apply-info {
      position: absolute;
      right: 0;
      top: 38px;
      min-width: 260px;
      max-width: 320px;
      border: 1px solid rgba(26, 34, 48, 0.08);
      border-radius: 14px;
      padding: 0.8rem 1rem;
      background: #fbfcff;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.12);
      z-index: 5;
    }
    .apply-info-disclosure .apply-info-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: 1rem;
      margin-bottom: 0.35rem;
      color: #0f172a;
    }
    .apply-info-disclosure .apply-info-list {
      margin: 0;
      padding-left: 1.1rem;
      color: #0f172a;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .expanded-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(200px, 0.85fr);
      gap: 1rem;
      margin-top: 1rem;
      }
    .expanded-body .lede { color: var(--clean-muted, #475569); margin: 0 0 0.65rem; line-height: 1.6; }
    .description-label {
      font-size: 0.95rem;
      letter-spacing: 0.16em;
      color: var(--clean-muted, #475569);
      margin-top: 0.6rem;
    }
    .expanded-body .main-description {
      color: #0f172a;
      line-height: 1.85;
      white-space: pre-line;
      font-size: 1.05rem;
      margin-top: 0.3rem;
    }
    .job-task-list {
      margin: 0.6rem 0 0 1.2rem;
      color: var(--clean-muted, #475569);
      line-height: 1.6;
      display: grid;
      gap: 6px;
    }
    .job-task-list li {
      font-size: 0.98rem;
    }
    .job-task-list li.task-completed {
      color: #94a3b8;
      text-decoration: line-through;
    }
    .job-task-list li.task-completed::marker {
      color: #94a3b8;
    }
    .job-task-empty {
      color: #94a3b8;
      font-size: 0.98rem;
      margin-top: 0.4rem;
    }
    .ghost-button {
      border: 1px solid rgba(26, 34, 48, 0.15);
      background: var(--clean-surface, #fff);
      color: #0f172a;
    }
    .apply-info-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    .apply-info-list {
      list-style: disc;
      padding-left: 1.2rem;
      text-align: left;
      margin: 0;
      display: grid;
      gap: 3px;
    }
    .apply-info-list li {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 0.95rem;
      color: #0f172a;
      line-height: 1.35;
    }
    .expanded-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding-top: 12px;
      border-top: 1px solid rgba(26, 34, 48, 0.08);
    }
    .posted-by {
      display: grid;
      grid-template-columns: auto auto 1fr;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .posted-label {
      grid-column: 1 / -1;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.78rem;
      color: var(--clean-muted, #6b7280);
    }
    .posted-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: cover;
      background: #e2e8f0;
    }
    .posted-link { text-decoration: none; color: inherit; }
    .posted-link:hover { text-decoration: none; }
    .posted-name {
      color: #0f172a;
      font-weight: 400;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
    }
    .posted-firm {
      color: var(--clean-muted, #6b7280);
      font-size: 0.98rem;
      font-family: 'Cormorant Garamond', serif;
      text-decoration: none;
    }
    .posted-count { color: var(--clean-muted, #475569); font-size: 0.9rem; }
    .expanded-footer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    @keyframes jobExpandIn {
      0% { opacity: 0; transform: translateY(18px) scale(.96); box-shadow: 0 12px 32px rgba(10,15,25,0.08); }
      60% { opacity: 1; transform: translateY(0) scale(1.012); box-shadow: 0 24px 70px rgba(10,15,25,0.14); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    body.job-expanded .layout {
      justify-content: center;
    }
    body.job-expanded aside.filter,
    body.job-expanded .results-header {
      display: none;
    }
    body.job-expanded .results {
      width: min(1040px, 100%);
      margin: 0 auto;
    }
    body.job-expanded .jobs-grid {
      align-items: center;
    }
    @media (max-width: 900px) {
      .expanded-grid { grid-template-columns: 1fr; }
    }

    .results-status {
      border: 1px dashed rgba(26, 34, 48, 0.15);
      border-radius: 18px;
      padding: 1.5rem;
      text-align: center;
      color: #64748b;
      background: rgba(255, 255, 255, 0.8);
    }

    #pagination {
      text-align: center;
      color: var(--clean-muted, #6b7280);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 18px;
    }

    .pagination-btn {
      border: 1px solid rgba(26, 34, 48, 0.2);
      background: var(--clean-surface, #ffffff);
      color: var(--clean-ink, #1a2230);
      padding: 0.35rem 1.1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    .pagination-btn:hover:not(:disabled) {
      background: rgba(136, 114, 68, 0.08);
      border-color: rgba(136, 114, 68, 0.35);
      color: #7b5f2a;
    }

    .pagination-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .pagination-btn:focus {
      outline: none;
      box-shadow: none;
    }

    .pagination-info {
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #7a8699;
    }

    @media (max-width: 960px) {
      .layout { flex-direction: column; }
      aside.filter {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(320px, 85vw);
        max-width: 90vw;
        height: 100vh;
        overflow-y: auto;
        transform: translateX(-110%);
        transition: transform 0.3s ease;
        z-index: 20;
        border-radius: 0;
        box-shadow: 12px 0 40px rgba(0, 0, 0, 0.28);
      }
      aside.filter.active { transform: translateX(0); }
      .filter-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.4rem 1rem;
        border: 1px solid rgba(26, 34, 48, 0.2);
        border-radius: 999px;
        background: transparent;
        color: var(--clean-ink, #1a2230);
        cursor: pointer;
        font-size: 0.9rem;
      }
      .jobs-shell {
        margin: 24px auto 0;
        padding-bottom: 24px;
      }
    }

    @media (max-width: 900px) {
      .sidebar-toggle {
        display: inline-flex;
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 2100;
      }

      body.nav-open .sidebar-backdrop {
        display: block;
      }
    }

    @media (max-width: 600px) {
      .jobs-shell {
        width: 100%;
        margin-top: 16px;
        padding-inline: 16px;
      }
    }
  </style>

  <div class="browse-page-shell lpc-auth-page-shell">
  <div class="lpc-universal-header-shell lpc-universal-header-shell--created" role="group" aria-label="Workspace tools" data-lpc-universal-header="true">
    <div class="lpc-universal-header-controls" data-notification-center="true" aria-label="Search, notifications, and Assistant">
      <div class="lpc-global-search-host" data-productivity-trigger-host></div>
      <div class="notification-wrapper"><button class="notification-icon" type="button" aria-label="View notifications" data-notification-toggle><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="notification-badge" data-notification-badge>0</span></button><div class="notifications-panel notif-panel hidden" role="region" aria-label="Notifications" aria-live="polite" data-notification-panel><div class="notif-header" aria-label="Notifications"></div><div class="notif-scroll" data-notification-list></div><div class="notif-empty" data-notification-empty>Loading…</div><button type="button" class="notif-markall" data-notification-mark>Mark All Read</button></div></div>
    </div>
  </div>
  <main id="main" tabindex="-1" class="jobs-shell">
    <div class="layout">
      <aside class="filter" id="filterMenu">
        <div class="browse-filter-heading">
          <h2 id="filterHeading">Filters</h2>
          <button type="button" id="filterClose" class="browse-filter-close" aria-label="Close filters">Close</button>
        </div>
        <div class="filter-group">
          <label for="filterPracticeArea">Practice area</label>
          <select id="filterPracticeArea">
            <option value="">Any</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterState">State</label>
          <select id="filterState">
            <option value="">Any</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterMinPay">Minimum compensation</label>
          <div class="slider-field">
            <input type="range" id="filterMinPay" min="400" max="900" step="25" value="400" />
            <span id="minPayValue">$400</span>
          </div>
        </div>
        <div class="filter-group">
          <label for="filterDeadline">Deadline</label>
          <select id="filterDeadline">
            <option value="">Any deadline</option>
            <option value="7_days">Next 7 days</option>
            <option value="30_days">Next 30 days</option>
            <option value="none">No deadline</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterPosted">Date posted</label>
          <select id="filterPosted">
            <option value="">Any time</option>
            <option value="7_days">Last 7 days</option>
            <option value="30_days">Last 30 days</option>
          </select>
        </div>
        <div class="filter-actions">
          <button type="button" class="primary" id="applyFilters">Update results</button>
          <button type="button" id="clearFilters">Clear</button>
        </div>
      </aside>

      <section class="results">
        <div class="results-header">
          <div class="title-block">
            <h1>Browse matters</h1>
            <p>Refine by jurisdiction, practice area, and compensation to match your workflow.</p>
          </div>
          <div class="results-controls">
            <label for="sortBy">Sort by</label>
            <select id="sortBy">
              <option value="newest" selected>Newest first</option>
              <option value="deadline">Deadline</option>
              <option value="payHigh">Highest pay</option>
              <option value="payLow">Lowest pay</option>
            </select>
            <button type="button" class="filter-toggle" id="filterToggle" aria-controls="filterDialog" aria-haspopup="dialog" aria-expanded="false">Filters <span id="activeFilterCount"></span></button>
          </div>
        </div>
        <div id="jobs-grid" class="jobs-grid">
          <p class="results-status">Loading available Matters…</p>
        </div>
        <div id="pagination"></div>
      </section>
    </div>
  </main>

  </div>

  <dialog id="filterDialog" class="browse-filter-dialog" aria-labelledby="filterHeading"></dialog>

  <div id="toastBanner" class="toast" role="status" aria-live="polite"></div>

  <script src="assets/scripts/utils/toast.js?v=20260208"></script>
